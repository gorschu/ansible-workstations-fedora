# Fedora Kickstart render inputs.
#
# The parser intentionally supports only this small shape:
#
# ssh_keys:
#   general: &ssh_key_general "ssh-ed25519 ..."
#
# hostname:
#   disk: /dev/disk/by-id/<target-disk>
#   ssh_public_key: *ssh_key_general
#
# Real user/LUKS secrets are not rendered into Kickstart. The installer uses
# fixed dummy bootstrap credentials and Ansible phase0 rotates them from
# bootstrap.vault.yml.

ssh_keys:
  general: &ssh_key_general "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMUkEk7GV/qWMR9SJFYSJSxwnPxR8fG2Fn9VILHcyPYQ"

fedora-kde-test:
  disk: /dev/disk/by-id/virtio-fedora-ks-root
  ssh_public_key: *ssh_key_general

hephaestus:
  disk: /dev/disk/by-id/nvme-SAMSUNG_MZVLW512HMJP-000L7_S359NX0HC16935
  ssh_public_key: *ssh_key_general
apollo:
  disk: /dev/disk/by-id/nvme-SAMSUNG_MZVLB1T0HBLR-000L7_S4EMNX0R310953
  ssh_public_key: *ssh_key_general
artemis:
  disk: /dev/disk/by-id/nvme-KINGSTON_SFYRS1000G_50026B7685EC110A
  ssh_public_key: *ssh_key_general
