---
- name: Bootstrap Btrfs storage facts and data unlock
  when: storage_btrfs_state == 'present'
  become: true
  tags: [phase1, phase2]
  block:
    - name: Ensure Fedora installer storage facts exist
      ansible.builtin.stat:
        path: "{{ storage_btrfs_facts_file }}"
      register: storage_btrfs_facts_file_stat

    - name: Fail if Fedora installer storage facts are missing
      ansible.builtin.fail:
        msg: >-
          {{ storage_btrfs_facts_file }} is missing. Fedora storage_btrfs expects
          the kickstart installer to record the root/data LUKS and Btrfs layout.
      when: not storage_btrfs_facts_file_stat.stat.exists

    - name: Read Fedora installer storage facts
      ansible.builtin.slurp:
        src: "{{ storage_btrfs_facts_file }}"
      register: storage_btrfs_facts_raw

    - name: Parse Fedora installer storage facts
      ansible.builtin.set_fact:
        storage_btrfs_installer_facts: "{{ storage_btrfs_facts_raw.content | b64decode | from_yaml }}"

    - name: Set storage devices from Fedora installer facts
      ansible.builtin.set_fact:
        storage_btrfs_root_device_final: >-
          {{ storage_btrfs_root_device if storage_btrfs_root_device != 'auto'
             else storage_btrfs_installer_facts.luks.root.mapper }}
        storage_btrfs_device_final: >-
          {{ storage_btrfs_device if storage_btrfs_device != 'auto'
             else storage_btrfs_installer_facts.luks.data.systemd_mapper }}
        storage_btrfs_data_luks_uuid: "{{ storage_btrfs_installer_facts.luks.data.uuid }}"
        storage_btrfs_data_mapper_name: >-
          {{ (storage_btrfs_device if storage_btrfs_device != 'auto'
              else storage_btrfs_installer_facts.luks.data.systemd_mapper)
             | regex_replace('^/dev/mapper/', '') }}
        storage_btrfs_data_subvolume_final: >-
          {{ storage_btrfs_installer_facts.subvolumes.data
             | default(storage_btrfs_subvolume) }}
        storage_btrfs_root_btrfs_uuid: "{{ storage_btrfs_installer_facts.filesystems.root.uuid }}"

    - name: Ensure data LUKS opens on boot
      ansible.builtin.lineinfile:
        path: /etc/crypttab
        regexp: '^{{ storage_btrfs_data_mapper_name | regex_escape }}\s+'
        line: >-
          {{ storage_btrfs_data_mapper_name }} UUID={{ storage_btrfs_data_luks_uuid }}
          none {{ storage_btrfs_crypttab_options }}
        owner: root
        group: root
        mode: "0600"
        create: true
      when: storage_btrfs_manage_crypttab | bool
      notify: Storage_btrfs.reload_systemd

    - name: Ensure fstrim timer is enabled
      ansible.builtin.systemd_service:
        name: fstrim.timer
        enabled: true
        state: started

    - name: Flush handlers after crypttab update
      ansible.builtin.meta: flush_handlers

    - name: Report phase1 reboot requirement
      ansible.builtin.debug:
        msg: >-
          Phase1 storage bootstrap is complete. Reboot now so systemd opens the
          data LUKS device from /etc/crypttab, then continue with phase2.
      when: "'phase1' in ansible_run_tags"
      tags: [phase1]

- name: Configure Btrfs data mounts
  when: storage_btrfs_state == 'present'
  become: true
  tags: [phase2]
  block:
    - name: Ensure encrypted data mapper exists
      ansible.builtin.stat:
        path: "{{ storage_btrfs_device_final }}"
      register: storage_btrfs_mapper

    - name: Fail if encrypted data mapper is missing
      ansible.builtin.fail:
        msg: >-
          {{ storage_btrfs_device_final }} is not open yet. Reboot after phase1,
          unlock the system normally, then rerun phase2.
      when: not storage_btrfs_mapper.stat.exists

    - name: Ensure root filesystem mount point exists
      ansible.builtin.file:
        path: "{{ storage_btrfs_root_mountpoint }}"
        state: directory
        mode: "0700"

    - name: Deploy root filesystem mount unit
      ansible.builtin.template:
        src: mnt-btrfs-root.mount.j2
        dest: /etc/systemd/system/mnt-btrfs_root.mount
        mode: "0644"
      notify: Storage_btrfs.reload_systemd

    - name: Ensure primary data mount point exists
      ansible.builtin.file:
        path: "{{ storage_btrfs_mountpoint }}"
        state: directory
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        mode: "0700"

    - name: Ensure data top-level mount point exists
      ansible.builtin.file:
        path: "{{ storage_btrfs_top_mountpoint }}"
        state: directory
        mode: "0700"

    - name: Deploy primary data mount unit
      ansible.builtin.template:
        src: home-primary-user-data.mount.j2
        dest: "/etc/systemd/system/home-{{ primary_user }}-data.mount"
        mode: "0644"
      notify: Storage_btrfs.reload_systemd

    - name: Deploy data top-level mount unit
      ansible.builtin.template:
        src: mnt-btrfs-data.mount.j2
        dest: /etc/systemd/system/mnt-btrfs_data.mount
        mode: "0644"
      notify: Storage_btrfs.reload_systemd

    - name: Flush handlers to reload systemd
      ansible.builtin.meta: flush_handlers

    - name: Enable and start root filesystem mount
      ansible.builtin.systemd_service:
        name: mnt-btrfs_root.mount
        enabled: true
        state: started

    - name: Enable and start primary data mount
      ansible.builtin.systemd_service:
        name: "home-{{ primary_user }}-data.mount"
        enabled: true
        state: started

    - name: Enable and start data top-level mount
      ansible.builtin.systemd_service:
        name: mnt-btrfs_data.mount
        enabled: true
        state: started

    - name: Ensure mounted root filesystem top-level ownership and mode
      ansible.builtin.file:
        path: "{{ storage_btrfs_root_mountpoint }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Ensure mounted data top-level ownership and mode
      ansible.builtin.file:
        path: "{{ storage_btrfs_top_mountpoint }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Refresh mount facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          - hardware

    - name: Ensure scratch subvolume exists
      community.general.btrfs_subvolume:
        name: "{{ storage_btrfs_scratch_subvolume }}"
        filesystem_uuid: "{{ storage_btrfs_root_btrfs_uuid }}"
        state: present

    - name: Ensure Homebrew subvolume exists
      community.general.btrfs_subvolume:
        name: "{{ storage_btrfs_homebrew_subvolume }}"
        filesystem_uuid: "{{ storage_btrfs_top_mountpoint | uuid_for_mount(ansible_facts['mounts']) }}"
        state: present

    - name: Ensure primary data root ownership and mode
      ansible.builtin.file:
        path: "{{ storage_btrfs_mountpoint }}"
        state: directory
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        mode: "0700"

    - name: Ensure common data directories exist
      ansible.builtin.file:
        path: "{{ storage_btrfs_mountpoint }}/{{ item.path }}"
        state: directory
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        mode: "{{ item.mode }}"
      loop: "{{ storage_btrfs_data_directories }}"

    - name: Ensure ~/.var mount point exists
      ansible.builtin.file:
        path: "{{ primary_user_home }}/.var"
        state: directory
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        mode: "0700"

    - name: Deploy ~/.var bind mount unit
      ansible.builtin.template:
        src: home-primary-user-dot-var.mount.j2
        dest: "/etc/systemd/system/home-{{ primary_user }}-.var.mount"
        mode: "0644"
      notify: Storage_btrfs.reload_systemd

    - name: Flush handlers to reload systemd
      ansible.builtin.meta: flush_handlers

    - name: Enable and start ~/.var bind mount
      ansible.builtin.systemd_service:
        name: "home-{{ primary_user }}-.var.mount"
        enabled: true
        state: started

    - name: Ensure ~/.scratch mount point exists
      ansible.builtin.file:
        path: "{{ storage_btrfs_scratch_mountpoint }}"
        state: directory
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        mode: "0700"

    - name: Ensure unmounted Homebrew mount point exists
      ansible.builtin.file:
        path: "{{ storage_btrfs_homebrew_mountpoint }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: storage_btrfs_homebrew_mountpoint not in (ansible_facts.mounts | map(attribute='mount') | list)

    - name: Deploy ~/.scratch mount unit
      ansible.builtin.template:
        src: home-primary-user-.scratch.mount.j2
        dest: "/etc/systemd/system/home-{{ primary_user }}-.scratch.mount"
        mode: "0644"
      notify: Storage_btrfs.reload_systemd

    - name: Deploy Homebrew mount unit
      ansible.builtin.template:
        src: home-linuxbrew.mount.j2
        dest: /etc/systemd/system/home-linuxbrew.mount
        mode: "0644"
      notify: Storage_btrfs.reload_systemd

    - name: Flush handlers to reload systemd
      ansible.builtin.meta: flush_handlers

    - name: Enable and start ~/.scratch mount
      ansible.builtin.systemd_service:
        name: "home-{{ primary_user }}-.scratch.mount"
        enabled: true
        state: started

    - name: Enable and start Homebrew mount
      ansible.builtin.systemd_service:
        name: home-linuxbrew.mount
        enabled: true
        state: started

    - name: Ensure mounted ~/.scratch ownership and mode
      ansible.builtin.file:
        path: "{{ storage_btrfs_scratch_mountpoint }}"
        state: directory
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        mode: "0700"

- name: Remove Btrfs data mounts
  when: storage_btrfs_state == 'absent'
  become: true
  tags: [phase2]
  block:
    - name: Stop and disable mount units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - home-linuxbrew.mount
        - "home-{{ primary_user }}-.scratch.mount"
        - "home-{{ primary_user }}-.var.mount"
        - "home-{{ primary_user }}-data.mount"
        - mnt-btrfs_data.mount
        - mnt-btrfs_root.mount
      failed_when: false

    - name: Remove mount units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/home-linuxbrew.mount
        - "/etc/systemd/system/home-{{ primary_user }}-.scratch.mount"
        - "/etc/systemd/system/home-{{ primary_user }}-.var.mount"
        - "/etc/systemd/system/home-{{ primary_user }}-data.mount"
        - /etc/systemd/system/mnt-btrfs_data.mount
        - /etc/systemd/system/mnt-btrfs_root.mount
      notify: Storage_btrfs.reload_systemd
