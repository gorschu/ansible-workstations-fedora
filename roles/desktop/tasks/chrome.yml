---
# Google Chrome

- name: Configure Google Chrome
  become: true
  block:
    - name: Add Google Linux packages GPG key
      ansible.builtin.rpm_key:
        state: "{{ 'present' if desktop_chrome_state == 'present' else 'absent' }}"
        key: "{{ desktop_chrome_repo_key }}"

    - name: Check whether Google Chrome repository already exists
      ansible.builtin.stat:
        path: /etc/yum.repos.d/google-chrome.repo
      register: desktop_chrome_repo_file

    - name: Configure Google Chrome repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/google-chrome.repo
        content: |
          [google-chrome]
          baseurl = {{ desktop_chrome_repo_baseurl }}
          enabled = 1
          gpgcheck = 1
          gpgkey = {{ desktop_chrome_repo_key }}
          name = Google Chrome
        owner: root
        group: root
        mode: "0644"
      when:
        - desktop_chrome_state == 'present'
        - not desktop_chrome_repo_file.stat.exists

    - name: Remove Google Chrome repository
      ansible.builtin.file:
        path: /etc/yum.repos.d/google-chrome.repo
        state: absent
      when: desktop_chrome_state == 'absent'

    - name: Install Google Chrome
      ansible.builtin.dnf:
        name: "{{ desktop_chrome_package }}"
        state: "{{ desktop_chrome_state }}"
