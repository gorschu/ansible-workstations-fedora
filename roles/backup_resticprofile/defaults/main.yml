---
# resticprofile role defaults

# resticprofile state: present or absent
backup_resticprofile_state: absent

# Configure profiles and schedule timers after installing the binary. Disable
# this for vault-free VM tests of the install path.
backup_resticprofile_configure_enabled: true

# Fedora carries restic and apprise, but not resticprofile. Install the upstream
# no-self-update binary so upgrades remain controlled by these pinned values.
backup_resticprofile_packages:
  - restic
  - apprise
backup_resticprofile_version: "0.33.1"
backup_resticprofile_release_platform: linux_amd64
backup_resticprofile_archive_name: >-
  resticprofile_no_self_update_{{ backup_resticprofile_version }}_{{
  backup_resticprofile_release_platform }}.tar.gz
backup_resticprofile_archive_url: >-
  https://github.com/creativeprojects/resticprofile/releases/download/v{{
  backup_resticprofile_version }}/{{ backup_resticprofile_archive_name }}
backup_resticprofile_archive_sha256: "1d7027d15e3e2456e585a210f811d0f72ec40f6b3388f00425642ed579165d70"
backup_resticprofile_install_dir: /opt/resticprofile
backup_resticprofile_bin_dir: "{{ backup_resticprofile_install_dir }}/bin"
backup_resticprofile_binary_path: "{{ backup_resticprofile_bin_dir }}/resticprofile"
backup_resticprofile_symlink_path: /usr/local/bin/resticprofile
backup_resticprofile_remove_packages_on_absent: true

# Backup sources - override in host_vars for machines with ZFS datasets etc.
backup_resticprofile_backup_sources:
  - "/home"
  - "/etc"
