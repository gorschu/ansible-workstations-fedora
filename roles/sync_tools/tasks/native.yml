---
- name: Install Fedora-native sync tools
  become: true
  ansible.builtin.dnf:
    name: "{{ sync_tools_packages + sync_tools_extra_packages }}"
    state: present
  when:
    - sync_tools_state == "present"
    - (sync_tools_packages + sync_tools_extra_packages) | length > 0

- name: Remove Fedora-native sync tools
  become: true
  ansible.builtin.dnf:
    name: "{{ sync_tools_packages + sync_tools_extra_packages }}"
    state: absent
  when:
    - sync_tools_state == "absent"
    - (sync_tools_packages + sync_tools_extra_packages) | length > 0
