---
- name: Ensure DNF repository override directory exists for MEGA
  become: true
  ansible.builtin.file:
    path: /etc/dnf/repos.override.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: sync_tools_mega_state == "present"

- name: Disable the duplicate repository recreated by MEGA package scripts
  become: true
  community.general.ini_file:
    path: /etc/dnf/repos.override.d/90-workstations-mega.repo
    section: MEGAsync
    option: enabled
    value: "0"
    no_extra_spaces: true
    owner: root
    group: root
    mode: "0644"
  when: sync_tools_mega_state == "present"

- name: Add MEGA repository GPG key
  become: true
  ansible.builtin.rpm_key:
    state: present
    key: "{{ sync_tools_mega_repo_gpgkey }}"
  when: sync_tools_mega_state == "present"

- name: Configure MEGA repository
  become: true
  ansible.builtin.yum_repository:
    name: "{{ sync_tools_mega_repo_name }}"
    file: "{{ sync_tools_mega_repo_file }}"
    description: "{{ sync_tools_mega_repo_description }}"
    baseurl: "{{ sync_tools_mega_repo_baseurl }}"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "{{ sync_tools_mega_repo_gpgkey }}"
    state: present
  when: sync_tools_mega_state == "present"

- name: Install MEGA sync tools
  become: true
  ansible.builtin.dnf:
    name: "{{ sync_tools_mega_packages + sync_tools_mega_extra_packages }}"
    state: present
  when:
    - sync_tools_mega_state == "present"
    - (sync_tools_mega_packages + sync_tools_mega_extra_packages) | length > 0

- name: Remove MEGA sync tools
  become: true
  ansible.builtin.dnf:
    name: "{{ sync_tools_mega_packages + sync_tools_mega_extra_packages }}"
    state: absent
  when:
    - sync_tools_mega_state == "absent"
    - (sync_tools_mega_packages + sync_tools_mega_extra_packages) | length > 0

- name: Remove MEGA repository
  become: true
  ansible.builtin.yum_repository:
    name: "{{ sync_tools_mega_repo_name }}"
    file: "{{ sync_tools_mega_repo_file }}"
    state: absent
  when: sync_tools_mega_state == "absent"

- name: Remove MEGA repository GPG key
  become: true
  ansible.builtin.rpm_key:
    state: absent
    key: "{{ sync_tools_mega_repo_gpgkey }}"
  when: sync_tools_mega_state == "absent"

- name: Remove MEGA's generated repository and its override
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/yum.repos.d/megasync.repo
    - /etc/dnf/repos.override.d/90-workstations-mega.repo
  when: sync_tools_mega_state == "absent"
