---
- name: Validate Insync platform
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] == "x86_64"
    fail_msg: Insync only publishes Fedora RPMs for x86_64.
    quiet: true
  when: sync_tools_insync_state == "present"

- name: Add Insync repository GPG key
  become: true
  ansible.builtin.rpm_key:
    state: present
    key: "{{ sync_tools_insync_repo_gpgkey }}"
  when: sync_tools_insync_state == "present"

- name: Configure Insync repository
  become: true
  ansible.builtin.yum_repository:
    name: "{{ sync_tools_insync_repo_name }}"
    file: "{{ sync_tools_insync_repo_file }}"
    description: "{{ sync_tools_insync_repo_description }}"
    baseurl: "{{ sync_tools_insync_repo_baseurl }}"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "{{ sync_tools_insync_repo_gpgkey }}"
    metadata_expire: "{{ sync_tools_insync_repo_metadata_expire }}"
    state: present
  when: sync_tools_insync_state == "present"

- name: Install Insync sync tools
  become: true
  ansible.builtin.dnf:
    name: "{{ sync_tools_insync_packages + sync_tools_insync_extra_packages }}"
    state: present
  when:
    - sync_tools_insync_state == "present"
    - (sync_tools_insync_packages + sync_tools_insync_extra_packages) | length > 0

- name: Remove Insync sync tools
  become: true
  ansible.builtin.dnf:
    name: "{{ sync_tools_insync_packages + sync_tools_insync_extra_packages }}"
    state: absent
  when:
    - sync_tools_insync_state == "absent"
    - (sync_tools_insync_packages + sync_tools_insync_extra_packages) | length > 0

- name: Remove Insync repository
  become: true
  ansible.builtin.yum_repository:
    name: "{{ sync_tools_insync_repo_name }}"
    file: "{{ sync_tools_insync_repo_file }}"
    state: absent
  when: sync_tools_insync_state == "absent"

- name: Remove Insync repository GPG key
  become: true
  ansible.builtin.rpm_key:
    state: absent
    key: "{{ sync_tools_insync_repo_gpgkey }}"
  when: sync_tools_insync_state == "absent"
