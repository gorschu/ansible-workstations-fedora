---
# CUPS printing

- name: Validate printing configuration
  ansible.builtin.assert:
    that:
      - printing_state in ["present", "absent"]
    quiet: true

- name: Configure CUPS printing
  when: printing_state == "present"
  become: true
  block:
    - name: Install CUPS packages
      ansible.builtin.dnf:
        name: "{{ printing_packages }}"
        state: present

    - name: Set default paper size to A4
      ansible.builtin.copy:
        content: "a4\n"
        dest: /etc/papersize
        owner: root
        group: root
        mode: "0644"

    - name: Enable CUPS socket activation
      ansible.builtin.systemd_service:
        name: cups.socket
        enabled: true
        state: started

    - name: Start CUPS service for printer configuration
      when: printing_printers | length > 0
      ansible.builtin.systemd_service:
        name: cups.service
        state: started

    - name: Check existing printers
      when: printing_printers | length > 0
      ansible.builtin.command:
        cmd: lpstat -p "{{ item.name }}"
      loop: "{{ printing_printers }}"
      register: printing_lpstat
      changed_when: false
      failed_when: false

    - name: Add missing printers
      when: item.rc != 0
      ansible.builtin.command:
        cmd: >-
          lpadmin -p "{{ item.item.name }}"
          -E
          -v "{{ item.item.uri }}"
          -m "{{ item.item.model | default('everywhere') }}"
          -D "{{ item.item.description | default(item.item.name) }}"
      loop: "{{ printing_lpstat.results | default([]) }}"
      changed_when: true

    - name: Build default printer list
      ansible.builtin.set_fact:
        printing_default_printers: >-
          {{ printing_printers
             | selectattr('default', 'defined')
             | selectattr('default')
             | list }}

    - name: Get current default printer
      when: printing_default_printers | length > 0
      ansible.builtin.command:
        cmd: lpstat -d
      register: printing_current_default
      changed_when: false
      failed_when: printing_current_default.rc not in [0, 1]

    - name: Set default printer
      ansible.builtin.command:
        cmd: lpadmin -d "{{ item.name }}"
      loop: "{{ printing_default_printers }}"
      when: item.name not in printing_current_default.stdout
      changed_when: true

- name: Disable CUPS printing
  when: printing_state == "absent"
  become: true
  block:
    - name: Stop CUPS service
      ansible.builtin.systemd_service:
        name: cups.service
        enabled: false
        state: stopped
      failed_when: false

    - name: Stop CUPS socket
      ansible.builtin.systemd_service:
        name: cups.socket
        enabled: false
        state: stopped
      failed_when: false
