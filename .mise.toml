# mise configuration for workstation Ansible repo
# Automatically installs pre-commit hooks on directory entry

[settings]
experimental = true
pipx.uvx = true

[tools]
opentofu = "1.12.6"                  # renovate: datasource=github-releases depName=opentofu/opentofu
scaleway-cli = "2.60.0"               # renovate: datasource=github-releases depName=scaleway/scaleway-cli
sops = "3.13.3"                      # renovate: datasource=github-releases depName=getsops/sops
age = "v1.3.1"                       # renovate: datasource=github-releases depName=FiloSottile/age
prek = "v0.3.6"                      # renovate: datasource=github-releases depName=j178/prek
# Ansible 14 uses core 2.21, which supports controller Python through 3.14.
# Remove the private runtime override once stable Ansible supports Python 3.15.
ansible = { version = "14.5.0", python = "3.14" } # renovate: datasource=pypi depName=ansible
pipx = "latest"
uv = "latest"
python = "3.15"
"pipx:ansible-lint" = "latest"

[tasks.install-hooks]
description = "Install pre-commit hooks using prek"
run = """
#!/bin/sh
if command -v prek >/dev/null 2>&1; then
  prek install --hook-type commit-msg
  prek install
  echo "prek hooks installed"
else
  echo "prek not available yet - mise will install it automatically"
fi
"""

[tasks.setup]
description = "Run initial setup"
depends = ["install-hooks"]

[hooks]
enter = "mise run install-hooks"
